# CERMAT di Docker. Port publik dari CERMAT_PORT (bawaan 8310), data di ${CERMAT_DIR:-/srv/cermat}.
# Jalankan lewat scripts/cermat-compose.sh (mengisi CERMAT_UID/GID/PORT dari oem & /srv/cermat/.env), mis.:
#   scripts/cermat-compose.sh build && scripts/cermat-compose.sh up -d --no-build
name: cermat

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  image: cermat-app:latest
  build:
    context: .
    target: app
    args:
      UID: ${CERMAT_UID:-1000}
      GID: ${CERMAT_GID:-1000}
  restart: unless-stopped
  logging: *logging
  environment:
    TZ: Asia/Jakarta
  volumes:
    - ${CERMAT_DIR:-/srv/cermat}/.env:/var/www/html/.env:ro
    - ${CERMAT_DIR:-/srv/cermat}/storage:/var/www/html/storage
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *app
    # php-fpm menutup soket lalu menuntaskan request berjalan (STOPSIGNAL SIGQUIT di image php-fpm).
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s

  queue:
    <<: *app
    # Urutan prioritas: "ai" (verifikasi satuan) dulu, lalu "ai-bulk" (verifikasi massal), lalu "default".
    command: php artisan queue:work --queue=ai,ai-bulk,default --tries=3
    stop_grace_period: 60s

  scheduler:
    <<: *app
    command: php artisan schedule:work

  nginx:
    image: cermat-web:latest
    build:
      context: .
      target: web
    restart: unless-stopped
    logging: *logging
    environment:
      TZ: Asia/Jakarta
    ports:
      - "${CERMAT_PORT:-8310}:80"
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    logging: *logging
    env_file: ${CERMAT_DIR:-/srv/cermat}/mysql.env
    environment:
      TZ: Asia/Jakarta
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+07:00"]
    volumes:
      - ${CERMAT_DIR:-/srv/cermat}/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
