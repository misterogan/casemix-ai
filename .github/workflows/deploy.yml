name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy-casemix
# Variabel repo CERMAT_DEPLOY memilih jalur (Settings → Secrets and variables → Actions → Variables):
#   (kosong/"host") → skrip host lama; "docker" → build & up kontainer. Hanya satu job yang berjalan.
jobs:
  deploy-host:
    if: github.ref == 'refs/heads/main' && vars.CERMAT_DEPLOY != 'docker'
    runs-on: [self-hosted, casemix]
    steps:
      - run: /usr/local/bin/deploy-casemix.sh

  deploy-docker:
    if: github.ref == 'refs/heads/main' && vars.CERMAT_DEPLOY == 'docker'
    runs-on: [self-hosted, casemix]
    defaults:
      run:
        working-directory: /var/www/casemix-ai
    steps:
      - name: Guard (host lama sudah dimatikan)
        run: |
          if systemctl is-active --quiet casemix-queue.service; then
            echo "casemix-queue.service masih aktif: cutover belum selesai, deploy Docker dibatalkan." >&2
            exit 1
          fi
      - name: Kode terbaru
        run: |
          git fetch --prune origin main
          git reset --hard origin/main
      - name: Mulai ukur jeda
        run: scripts/ukur-jeda.sh mulai "$RUNNER_TEMP/jeda.log"
      # Build dulu: kontainer lama tetap melayani selama build.
      - name: Build
        run: scripts/cermat-compose.sh build
      # Hanya service yang image/konfigurasinya berubah yang dibuat ulang; --no-deps → MySQL tidak disentuh.
      - name: Up app
        run: scripts/cermat-compose.sh up -d --no-build --no-deps --wait --wait-timeout 120 app
      - name: Up queue, scheduler, nginx
        run: scripts/cermat-compose.sh up -d --no-build --no-deps --remove-orphans queue scheduler nginx
      - name: Migrasi
        run: scripts/cermat-compose.sh exec -T app php artisan migrate --force
      - name: Hasil ukur jeda
        if: always()
        run: scripts/ukur-jeda.sh selesai "$RUNNER_TEMP/jeda.log"
      - name: Status
        run: |
          scripts/cermat-compose.sh ps
          docker image prune -f
