server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 200M;

    # Resolusi DNS Docker per request: setelah kontainer app dibuat ulang (IP baru) nginx tidak menyimpan IP lama.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $cermat_app app:9000;

    # App belum siap (deploy/restart) → halaman statis, bukan 502 mentah. Respons 503 dari Laravel
    # (php artisan down) tetap lolos karena fastcgi_intercept_errors mati.
    error_page 502 503 504 =503 /__cermat_diperbarui.html;
    location = /__cermat_diperbarui.html {
        root /usr/share/nginx/cermat;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        add_header X-Cermat "diperbarui" always;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # pdf.js worker (.mjs) harus terkirim sebagai JavaScript.
    location ~* \.mjs$ {
        types { }
        default_type application/javascript;
        expires 30d;
        try_files $uri =404;
    }

    location /build/ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $cermat_app;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # X-Forwarded-Proto/Host/Port dari tailscale serve diteruskan apa adanya (HTTP_X_FORWARDED_*);
        # jangan menimpanya dengan $scheme/$host — Laravel memercayainya lewat TRUSTED_PROXIES.
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
