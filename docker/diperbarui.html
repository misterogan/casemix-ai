<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>CERMAT sedang diperbarui</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #1e293b; }
  .kotak { max-width: 420px; padding: 32px 24px; text-align: center; }
  .putar { width: 36px; height: 36px; margin: 0 auto 20px; border: 4px solid #cbd5e1; border-top-color: #0f766e;
           border-radius: 50%; animation: putar 1s linear infinite; }
  h1 { font-size: 1.25rem; margin: 0 0 8px; }
  p { margin: 0; color: #475569; line-height: 1.5; }
  @keyframes putar { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="kotak">
  <div class="putar"></div>
  <h1>CERMAT sedang diperbarui</h1>
  <p>Mohon tunggu sebentar. Halaman akan dimuat ulang otomatis dalam 5 detik.</p>
</div>
</body>
</html>
