; Pool PHP-FPM khusus Casemix AI -> /etc/php/8.4/fpm/pool.d/casemix.conf
; Terpisah dari pool "www" (antrol) agar batas unggah/memori tidak saling memengaruhi.
[casemix]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm-casemix.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

php_admin_value[upload_max_filesize] = 25M
php_admin_value[post_max_size] = 200M
php_admin_value[memory_limit] = 512M
php_admin_value[max_execution_time] = 120
php_admin_flag[expose_php] = off
