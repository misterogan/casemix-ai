# Casemix AI dengan HTTPS -> /etc/nginx/sites-available/casemix-ai (gantikan casemix-ai.conf)
# Data rekam medis tidak boleh lewat HTTP polos, termasuk di jaringan internal RS.
#
# Sertifikat: pakai sertifikat dari CA internal RS, atau buat sendiri untuk sementara:
#   sudo openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
#     -keyout /etc/ssl/private/casemix-ai.key -out /etc/ssl/certs/casemix-ai.crt \
#     -subj "/CN=casemix.rs.local" -addext "subjectAltName=DNS:casemix.rs.local,IP:10.0.0.10"
# Setelah aktif, set SESSION_SECURE_COOKIE=true dan APP_URL=https://... di .env, lalu php artisan config:cache.

# Port lama 8300 dialihkan ke HTTPS
server {
    listen 8300;
    listen [::]:8300;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;
    root /var/www/casemix-ai/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/ssl/certs/casemix-ai.crt;
    ssl_certificate_key /etc/ssl/private/casemix-ai.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:casemix:10m;
    ssl_session_timeout 1d;

    client_max_body_size 200M;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm-casemix.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}
