# Casemix AI — nginx. Placeholder __...__ diisi oleh setup-server.sh.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;
    root __APP_DIR__/public;
    index index.php;
    charset utf-8;

    # Unggah dokumen (maks. 20 file x 20 MB per kiriman, dibatasi juga oleh aplikasi)
    client_max_body_size 200M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php__PHP_VER__-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # Tolak file tersembunyi (.env, .git) dan file PHP selain index.php
    location ~ /\.(?!well-known).* { deny all; }
    location ~ \.php$ { return 404; }
}

# HTTPS (disarankan): pasang sertifikat dari TI RS, lalu tambahkan blok server listen 443 ssl
# dan arahkan port 80 ke https. Setelah HTTPS aktif, set SESSION_SECURE_COOKIE=true di .env.
